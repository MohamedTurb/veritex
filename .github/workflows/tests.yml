name: CI — Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run all tests
    runs-on: ubuntu-latest
    env:
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare report folders
        run: |
          mkdir -p reports/cypress
          mkdir -p reports/newman
          mkdir -p reports/playwright
          mkdir -p reports/selenium
          mkdir -p reports/vitest

      - name: Install Playwright browsers and dependencies
        run: npx playwright install --with-deps

      - name: Install Cypress binary
        run: npx cypress install

      - name: Run unit + integration tests (Vitest)
        # Capture Vitest JSON output for artifact upload
        run: npx vitest run --reporter=json > reports/vitest/vitest.json || true

      - name: Run Playwright E2E tests
        # Generate JUnit output in playwright results (junit reporter)
        run: npx playwright test --reporter=list --reporter=junit || true

      - name: Run Cypress smoke tests (headless)
        # Export JUnit XML for Cypress
        run: npx cypress run --reporter junit --reporter-options "mochaFile=reports/cypress/results-[hash].xml" || true

      - name: Run Postman collection with Newman
        run: newman run tests/postman/veritex-smoke.postman_collection.json -e tests/postman/local.postman_environment.json --reporters cli,junit --reporter-junit-export reports/newman/newman-junit.xml || true

      - name: Run Selenium smoke test
        run: |
          mkdir -p reports/selenium
          node tests/selenium/shop.smoke.test.mjs > reports/selenium/selenium-output.txt 2>&1 || true

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            reports/**
            cypress/screenshots
            cypress/videos
            playwright-report/**
            test-results/**
