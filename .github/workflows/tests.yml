name: CI — Comprehensive Test Suite

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting with Prettier
        run: npm run format -- --check

  test:
    name: Run All Tests
    runs-on: ubuntu-latest
    env:
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare report folders
        run: |
          mkdir -p reports/cypress
          mkdir -p reports/newman
          mkdir -p reports/playwright
          mkdir -p reports/selenium
          mkdir -p reports/vitest
          mkdir -p reports/coverage

      - name: Install Playwright browsers and dependencies
        run: npx playwright install --with-deps

      - name: Install Cypress binary
        run: npx cypress install

      - name: Run ESLint checks
        run: npm run lint

      - name: Run unit + integration tests (Vitest) with coverage
        run: npm run test:coverage

      - name: Run accessibility tests (A11y)
        run: npm run test:a11y || true

      - name: Run Playwright E2E tests (Multi-browser)
        run: npx playwright test --reporter=html,junit || true

      - name: Run Cypress smoke tests (headless)
        run: npx cypress run --reporter junit --reporter-options "mochaFile=reports/cypress/results-[hash].xml" || true

      - name: Run Postman collection with Newman
        run: npm run postman:run --reporters cli,junit --reporter-junit-export reports/newman/newman-junit.xml || true

      - name: Run Selenium smoke test
        run: |
          mkdir -p reports/selenium
          npm run selenium:run > reports/selenium/selenium-output.txt 2>&1 || true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            reports/**
            coverage/**
            cypress/screenshots
            cypress/videos
            playwright-report/**
            test-results/**
          retention-days: 30

      - name: Comment PR with test results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let comment = '## Test Results 🧪\n\n';
            
            if (fs.existsSync('./coverage/coverage-summary.json')) {
              const coverage = JSON.parse(fs.readFileSync('./coverage/coverage-summary.json', 'utf8'));
              const total = coverage.total;
              comment += `### Coverage Summary\n`;
              comment += `- Lines: ${total.lines.pct}%\n`;
              comment += `- Functions: ${total.functions.pct}%\n`;
              comment += `- Branches: ${total.branches.pct}%\n`;
              comment += `- Statements: ${total.statements.pct}%\n\n`;
            }
            
            comment += '✅ All tests completed!\n';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  lighthouse:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v9
        with:
          configPath: './lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true
        continue-on-error: true

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Check for known vulnerabilities
        run: npm audit fix --dry-run
        continue-on-error: true

  build:
    name: Build & Bundle Size Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Check bundle size
        run: |
          BUNDLE_SIZE=$(du -sh dist/ | cut -f1)
          echo "Build size: $BUNDLE_SIZE"
          if [ $(du -s dist/ | cut -f1) -gt 5000 ]; then
            echo "⚠️ Bundle size warning: exceeds 5MB"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist/
          retention-days: 7

